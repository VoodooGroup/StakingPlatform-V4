<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voodoo Staking Portal</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/Voodoo-Token-Logo.png">
  <link rel="shortcut icon" type="image/png" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/Voodoo-Token-Logo.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a2f3c">
  <meta property="og:image" content="/Voodoo-Token-Logo.png">
  <meta name="msapplication-TileImage" content="/Voodoo-Token-Logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <link rel="stylesheet" href="/css/staking.css?v=66" />
  <link rel="stylesheet" href="/js/rainbow-bridge.css?v=66" />
</head>
<body class="flex flex-col">

  <div id="voodoo-bg" aria-hidden="true" style="background-image:url('/voodoo-token-background.png')"></div>

  <nav class="flex items-center justify-between p-4 shadow-md bg-white">
    <div class="flex items-center pl-4 space-x-6">
      <a href="https://voodootoken.com/staking-quide/" target="_blank" rel="noopener noreferrer">
        <img data-sp4="buttonGuide" src="/button-1.png" alt="Guide" width="40" height="40" class="h-10 w-auto" style="background:transparent" />
      </a>
      <a href="#" id="openCalculator" class="inline-block">
        <img data-sp4="calculator" src="/voodoo-token-calculator.png" alt="Calculator" class="h-[47px] w-auto rounded hover:opacity-90 transition-opacity cursor-pointer" style="background:transparent" />
      </a>
    </div>
    <div class="pr-4 wallet-actions">
      <button
        type="button"
        id="voodooWalletBtn"
        class="wallet-btn wallet-btn-voodoo"
        title="Connect with Voodoo Wallet browser extension"
      >Voodoo Wallet</button>
      <button
        type="button"
        id="connectBtn"
        class="wallet-btn wallet-btn-other"
        title="RainbowKit: WalletConnect, MetaMask, Rabby, Trust, OKX, …"
      >Other</button>
    </div>
  </nav>

  <!-- RainbowKit island (WalletConnect is inside this modal) -->
  <div id="rainbowkit-root"></div>

  <div class="flex justify-center mt-6 mb-4">
    <img data-sp4="flowIcons" src="/icons.png" alt="Staking flow" class="w-64 h-auto" style="background:transparent" />
  </div>

  <h1 id="activeSince" class="text-4xl mb-8 text-white text-center font-bold drop-shadow-lg">
    Active Since: calculating...
  </h1>

  <main class="flex-grow p-4 md:p-8 max-w-7xl mx-auto">
    <div id="poolsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
  </main>

  <footer class="bg-black text-white py-3 mt-auto">
    <div class="px-5 flex flex-col md:flex-row justify-between items-center">
      <p id="footerCopyright" data-sp4="footerText" class="text-sm order-1 md:order-1">&copy; 2026 VoodooGroup &bull; All rights reserved</p>
      <div class="flex space-x-6 order-2 md:order-2">
        <a href="https://x.com/Voodoo_Token/" target="_blank" class="transition"><i class="fa fa-twitter"></i></a>
        <a href="https://t.me/+oBoh-NebaWcxMDQ0" target="_blank" class="transition"><i class="fa fa-telegram"></i></a>
        <a href="https://www.youtube.com/@Voodoo_Token" target="_blank" class="transition"><i class="fa fa-youtube-play"></i></a>
      </div>
    </div>
  </footer>

  <div id="calculatorModal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 hidden">
    <div class="bg-gray-800 rounded-xl shadow-2xl max-w-lg w-full mx-4 max-h-[90vh] overflow-y-auto relative">
      <button id="closeModal" class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl font-bold">&times;</button>
      <div class="p-6">
        <h1 class="text-2xl font-bold mb-4 text-center text-white">Staking Calculator</h1>
        <img data-sp4="voodooLogo" src="/Voodoo-Token-Logo.png" alt="Voodoo Token Logo" class="w-16 h-16 mx-auto mb-6" style="background:transparent" />
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-200">Voodoo Tokens to Stake</label>
          <input type="number" id="voodooAmount" min="0" step="0.01" placeholder="Enter amount" class="mt-1 block w-full rounded-md bg-gray-700 border border-gray-600 text-white shadow-sm">
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-200">Select Pool</label>
          <select id="poolSelect" class="mt-1 block w-full rounded-md bg-gray-700 border border-gray-600 text-white shadow-sm">
            <option value="">Loading live rates...</option>
          </select>
        </div>
        <div class="mb-6">
          <button onclick="calculateRewards()" class="w-full bg-black text-white py-2 px-4 rounded-md hover:bg-gray-900">Calculate</button>
        </div>
        <div id="result" class="mt-6 hidden">
          <h2 class="text-lg font-semibold text-white">Results</h2>
          <p id="usedApy" class="text-gray-300 text-sm mb-1"></p>
          <p id="rewardAmount" class="text-gray-200"></p>
          <p id="usdValue" class="text-gray-200"></p>
        </div>
        <p id="error" class="mt-4 text-red-400 hidden"></p>
        <div class="mt-8 text-sm text-gray-400">
          <h2 class="text-lg font-semibold mb-2 text-white">About this Tool</h2>
          <p>APY values are loaded live from the StakingPlatformV4 smart contract (same rates as the pool cards).</p>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/config.js?v=66"></script>
  <script src="/js/ui.js?v=66"></script>
  <script src="/js/StakingPlatformV4.js?v=66"></script>
  <script src="/js/stakingAbi.js?v=66"></script>
  <script src="/js/contracts.js?v=66"></script>
  <script src="/js/wallet.js?v=66"></script>
  <script src="/js/apy.js?v=66"></script>
  <script src="/js/calculator.js?v=66"></script>
  <script src="/js/pools.js?v=66"></script>
  <script src="/js/poolRenderer.js?v=66"></script>
  <script src="/js/activeSince.js?v=66"></script>
  <script src="/js/app.js?v=66"></script>
  <!-- RainbowKit: WalletConnect is inside the Other modal -->
  <script src="/js/rainbow-bridge.js?v=66" defer></script>
  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        if (!window.VoodooRainbow || !window.VoodooRainbow.ready) {
          console.error('[Voodoo] RainbowKit not ready. Check Network for /js/rainbow-bridge.js');
        } else {
          console.info('[Voodoo] RainbowKit ready — WC inside Other. After WC, Other remounts RK if needed.');
        }
      }, 2500);
    });
  </script>
  <script>
    (function () {
      var modal = document.getElementById('calculatorModal');
      var openLink = document.getElementById('openCalculator');
      var closeBtn = document.getElementById('closeModal');

      function showCalculatorModal() {
        modal.classList.remove('hidden');
        window.VoodooCalculator.refreshPools();
      }

      function hideCalculatorModal() {
        modal.classList.add('hidden');
      }

      openLink.addEventListener('click', function (e) {
        e.preventDefault();
        showCalculatorModal();
      });

      closeBtn.addEventListener('click', hideCalculatorModal);

      modal.addEventListener('click', function (e) {
        if (e.target === modal) hideCalculatorModal();
      });

      window.calculateRewards = function () {
        return window.VoodooCalculator.runCalculate();
      };
    })();
  </script>
</body>
</html>
